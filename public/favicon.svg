<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F6CBD"/>
      <stop offset="100%" stop-color="#0A9C6F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- Medical cross with modern styling -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="27" y="16" width="10" height="32" rx="5" fill="white"/>
    <!-- Horizontal bar -->
    <rect x="16" y="27" width="32" height="10" rx="5" fill="white"/>
  </g>
  
  <!-- Small heart accent (healthcare symbol) -->
  <path d="M32 42 C32 42, 28 38, 26 36 C24 34, 24 31, 26 29 C28 27, 30 27, 32 29 C34 27, 36 27, 38 29 C40 31, 40 34, 38 36 C36 38, 32 42, 32 42Z" 
        fill="#FF6B9D" opacity="0.3"/>
</svg>

