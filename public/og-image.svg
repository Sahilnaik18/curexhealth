<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020D1A"/>
      <stop offset="50%" style="stop-color:#041A2E"/>
      <stop offset="100%" style="stop-color:#020D1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F6CBD"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#0F6CBD;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0F6CBD;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#00B894;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00B894;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Top accent bar -->
  <rect width="1200" height="6" fill="url(#accent)"/>

  <!-- Logo mark -->
  <rect x="80" y="200" width="72" height="72" rx="16" fill="#0F6CBD"/>
  <line x1="116" y1="212" x2="116" y2="260" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="92" y1="236" x2="140" y2="236" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="172" y="248" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="white">Curex<tspan fill="#00B894">health</tspan></text>
  <text x="172" y="278" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="4">HOME HEALTHCARE</text>

  <!-- Main headline -->
  <text x="80" y="360" font-family="system-ui, sans-serif" font-size="58" font-weight="900" fill="white">Expert Healthcare,</text>
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="58" font-weight="900">
    <tspan fill="#60A5FA">Delivered </tspan>
    <tspan fill="#34D399">Home</tspan>
  </text>

  <!-- Subheadline -->
  <text x="80" y="490" font-family="system-ui, sans-serif" font-size="26" fill="rgba(255,255,255,0.65)">Certified physiotherapists, nurses &amp; specialists · Mumbai · 50+ Areas</text>

  <!-- Stats row -->
  <rect x="80" y="530" width="220" height="60" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="190" y="555" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#60A5FA">10,000+</text>
  <text x="190" y="578" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Happy Patients</text>

  <rect x="320" y="530" width="200" height="60" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="420" y="555" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#34D399">4.9★</text>
  <text x="420" y="578" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Average Rating</text>

  <rect x="540" y="530" width="200" height="60" rx="12" fill="rgba(255,255,255,0.06)"/>
  <text x="640" y="555" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F87171">50+</text>
  <text x="640" y="578" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">Areas in Mumbai</text>

  <!-- URL -->
  <text x="1120" y="578" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" fill="rgba(255,255,255,0.35)">curexhealth.com</text>
</svg>
